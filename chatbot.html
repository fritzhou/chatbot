<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>School Inquiry Assistant</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">

    <div class="chat-shell">

      <!-- Desktop-only brand panel; hidden on mobile to match the widget look -->
      <aside class="brand-panel">
        <div class="brand-mark"><img src="logo-mark.svg" alt="" class="mark-icon" /></div>
        <h1 class="brand-title">Lourdes College School Inquiry<br />Assistant</h1>
        <p class="brand-tagline">
          Ask about enrollment, tuition, the registrar, scholarships, and
          campus services — answered instantly from our official FAQ desk.
        </p>

        <nav class="brand-links" id="brand-category-list" aria-label="Browse by category"></nav>
      </aside>

      <div class="chat-panel">

        <header class="chat-header">
          <div class="avatar" aria-hidden="true"><img src="logo-mark.svg" alt="" class="mark-icon" /></div>
          <div class="header-text">
            <p class="assistant-name">Lourdes College School Inquiry Assistant</p>
            <p class="status-line" id="connection-status" data-state="loading">
              <span class="status-dot"></span>
              <span id="status-label">Connecting…</span>
            </p>
          </div>

          <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle light or dark theme" title="Toggle theme">
            <svg id="theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
            </svg>
            <svg id="theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden>
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
            </svg>
          </button>

          <div class="menu-wrap">
            <button type="button" id="menu-btn" class="icon-btn" aria-label="More options" aria-expanded="false">⋯</button>
            <div id="menu-popover" class="popover" hidden>
              <label class="popover-label" for="language-select">Language</label>
              <select id="language-select">
                <option value="en">English</option>
                <option value="fil">Filipino</option>
                <option value="ceb">Cebuano</option>
              </select>
            </div>
          </div>
        </header>

        <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>

        <nav class="quick-chips" id="category-rail" aria-label="Browse by category"></nav>

        <form id="chat-form" class="chat-form">
          <input
            id="chat-input"
            type="text"
            name="message"
            autocomplete="off"
            placeholder="Message the assistant…"
            aria-label="Type your question"
            required
          />
          <button type="submit" class="send-btn" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2 11 13"></path>
              <path d="M22 2 15 22l-4-9-9-4 20-7Z"></path>
            </svg>
          </button>
        </form>

      </div>
    </div>

  </div>
  <script type="module" src="chatbot.js"></script>
</body>
</html>
